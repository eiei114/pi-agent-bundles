version: 2

# Keep routine version updates for all ecosystems in one weekly PR.
# Security updates remain outside this version-update group.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: tuesday
      time: "02:00"
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - dependabot
      - maintenance
    commit-message:
      prefix: chore(deps)
      include: scope

updates:
  - package-ecosystem: npm
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    open-pull-requests-limit: 1
    # Cursor SDK 1.0.23 and Connect 1.7 require protobuf 1.x. Upgrade this
    # dependency graph together after the SDK raises its contract.
    ignore:
      - dependency-name: "@bufbuild/protobuf"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@connectrpc/connect"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    open-pull-requests-limit: 1
    labels:
      - ci
